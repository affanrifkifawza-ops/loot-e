<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun - Loot - E</title>
    <!-- Google Fonts & Phosphor Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              brand: {
                yellow: "#F5B700",
                dark: "#303135",
                footer: "#383838",
                bg: "#F8F9FA",
                accent: "#16A34A",
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-[#F8F9FA] font-sans antialiased text-gray-900 min-h-screen">
    <div class="min-h-screen flex flex-col lg:flex-row">
      <!-- Bagian Kiri: Formulir Pendaftaran -->
      <div
        class="w-full lg:w-1/2 flex flex-col justify-between p-6 sm:p-10 md:p-14 lg:p-16 bg-white shadow-sm z-10 overflow-y-auto"
      >
        <!-- Header Brand -->
        <div>
          <a
            href="landingpage.html"
            class="inline-flex items-center gap-3 group"
          >
            <img
              src="assets/logo loote.jpeg"
              alt="Logo Loot - E"
              class="w-10 h-10 rounded-full object-cover border border-gray-200 shadow-sm transition group-hover:scale-105"
            />
            <span class="font-bold text-xl tracking-tight text-gray-900"
              >Loot - <span class="text-brand-yellow">E</span></span
            >
          </a>
        </div>

        <!-- Konten Utama Pendaftaran -->
        <div class="w-full max-w-md mx-auto my-6">
          <div class="mb-6">
            <h1
              class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight"
            >
              Daftar Akun
            </h1>
            <p class="text-gray-500 text-sm sm:text-base mt-2">
              Buat akun baru untuk mulai menggunakan layanan Loot-E.
            </p>
          </div>

          <!-- Alert Error (Dinamis dari Backend API) -->
          <div
            id="errorAlert"
            class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-3 transition"
          >
            <i
              class="ph ph-warning-circle text-xl flex-shrink-0 text-red-600 mt-0.5"
            ></i>
            <div id="errorMessageContainer" class="flex-1 font-medium">
              <ul id="errorList" class="list-disc ml-4 space-y-1"></ul>
            </div>
          </div>

          <form id="registerForm" class="space-y-4">
            <!-- Input Nama Lengkap -->
            <div>
              <label
                for="nama_lengkap"
                class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Nama Lengkap</label
              >
              <div class="relative">
                <i
                  class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"
                ></i>
                <input
                  type="text"
                  id="nama_lengkap"
                  name="nama_lengkap"
                  placeholder="Masukkan nama lengkap Anda"
                  required
                  class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 bg-white text-gray-900 text-sm placeholder-gray-400 focus:outline-none focus:border-brand-yellow focus:ring-2 focus:ring-brand-yellow/30 transition shadow-sm"
                />
              </div>
            </div>

            <!-- Input Email -->
            <div>
              <label
                for="email"
                class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Alamat Email</label
              >
              <div class="relative">
                <i
                  class="ph ph-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"
                ></i>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="nama@contoh.com"
                  required
                  class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 bg-white text-gray-900 text-sm placeholder-gray-400 focus:outline-none focus:border-brand-yellow focus:ring-2 focus:ring-brand-yellow/30 transition shadow-sm"
                />
              </div>
            </div>

            <!-- Input Kata Sandi -->
            <div>
              <label
                for="password"
                class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Kata Sandi</label
              >
              <div class="relative">
                <i
                  class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"
                ></i>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Minimal 8 karakter"
                  required
                  minlength="8"
                  class="w-full pl-11 pr-11 py-3 rounded-xl border border-gray-300 bg-white text-gray-900 text-sm placeholder-gray-400 focus:outline-none focus:border-brand-yellow focus:ring-2 focus:ring-brand-yellow/30 transition shadow-sm"
                />
                <button
                  type="button"
                  id="togglePassword"
                  class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition"
                >
                  <i class="ph ph-eye text-lg"></i>
                </button>
              </div>
            </div>

            <!-- Input Konfirmasi Kata Sandi -->
            <div>
              <label
                for="confirm_password"
                class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Konfirmasi Kata Sandi</label
              >
              <div class="relative">
                <i
                  class="ph ph-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"
                ></i>
                <input
                  type="password"
                  id="confirm_password"
                  name="confirm_password"
                  placeholder="Ulangi kata sandi Anda"
                  required
                  class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 bg-white text-gray-900 text-sm placeholder-gray-400 focus:outline-none focus:border-brand-yellow focus:ring-2 focus:ring-brand-yellow/30 transition shadow-sm"
                />
              </div>
            </div>

            <!-- Syarat & Ketentuan Checkbox -->
            <div class="pt-1">
              <label
                class="flex items-start gap-2.5 cursor-pointer text-sm text-gray-600 select-none"
              >
                <input
                  type="checkbox"
                  id="terms"
                  name="terms"
                  required
                  class="w-4 h-4 mt-0.5 rounded border-gray-300 text-brand-yellow focus:ring-brand-yellow/40"
                />
                <span
                  >Saya menyetujui
                  <a
                    href="#"
                    class="font-semibold text-brand-yellow hover:underline"
                    >Syarat & Ketentuan</a
                  >
                  Loot-E</span
                >
              </label>
            </div>

            <!-- Tombol Daftar -->
            <button
              type="submit"
              id="submitBtn"
              class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-brand-yellow hover:bg-yellow-500 active:scale-[0.99] transition shadow-md hover:shadow-lg flex items-center justify-center gap-2 cursor-pointer mt-4"
            >
              <span id="btnText">Daftar Akun</span>
              <i id="btnIcon" class="ph ph-arrow-right font-bold text-lg"></i>
              <svg
                id="btnSpinner"
                class="hidden animate-spin h-5 w-5 text-white"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8v8H4z"
                ></path>
              </svg>
            </button>
          </form>

          <!-- Tautan Login -->
          <p class="text-center text-sm text-gray-500 mt-6">
            Sudah punya akun?
            <a
              href="login.html"
              class="font-bold text-brand-yellow hover:text-yellow-600 hover:underline transition ml-1"
              >Masuk</a
            >
          </p>
        </div>

        <!-- Footer Halaman -->
        <!-- <div
                class="flex flex-col sm:flex-row items-center justify-between gap-2 pt-6 border-t border-gray-100 text-xs text-gray-400">
                <span>&copy; 2026 Loot-E. All rights reserved.</span>
                <div class="flex gap-4">
                    <a href="#" class="hover:text-gray-600 transition">Privacy</a>
                    <a href="#" class="hover:text-gray-600 transition">Terms</a>
                    <a href="landingpage.html" class="hover:text-gray-600 transition">Beranda</a>
                </div>
            </div> -->
      </div>

      <!-- Bagian Kanan: Panel Visual -->
      <div
        class="hidden lg:flex lg:w-1/2 relative items-center justify-center p-12 overflow-hidden text-white"
      >
        <!-- Decorative Background Patterns -->
        <div
          class="absolute -bottom-24 -left-24 w-96 h-96 bg-green-500/10 rounded-full blur-3xl pointer-events-none"
        ></div>

        <div
          class="max-w-md text-center relative z-10 flex flex-col items-center"
        >
          <!-- Indicator Dots -->
          <div class="flex items-center gap-2">
            <!-- <span class="w-8 h-2.5 rounded-full bg-brand-yellow"></span> -->
            <span class="w-2.5 h-2.5 rounded-full bg-gray-300"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-gray-300"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-gray-300"></span>
          </div>
        </div>
      </div>
    </div>


  </body>
</html>
